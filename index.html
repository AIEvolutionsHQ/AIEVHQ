<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Evolutions HQ | Computer Solutions</title>
<style>
  * {margin:0; padding:0; box-sizing:border-box;}
  body { font-family: Arial, sans-serif; background:#f4f4f4; padding:20px; }

  /* Header styles */
  header { background:#0d6efd; color:#fff; padding:20px 0; }
  header .container { max-width:1200px; margin:auto; display:flex; justify-content:space-between; align-items:center; padding:0 20px; }

  nav a { margin-left:20px; font-weight:bold; cursor:pointer; }

  /* Sections */
section { display:none; padding:60px 20px; max-width:1200px; margin:auto; }
section.active { display:block; }

h2 { text-align:center; margin-bottom:40px; font-size:2rem; color:#0d6efd; }

.hero { background:url('https://images.unsplash.com/photo-1519389950473-47ba0277781c?ixlib=rb-4.0.4&auto=format&fit=crop&w=1600&q=80') no-repeat center/cover; height:80vh; display:flex; justify-content:center; align-items:center; color:#fff; font-size:2rem; font-weight:bold; }
.hero h2 { background:rgba(0,0,0,0.5); padding:10px 20px; border-radius:8px; }

 /* Page navigation functions will be added in script below */

 /* Music Player Styles, as before */
#custom-player {
  display:flex; align-items:center; justify-content:center; gap:10px; padding:10px; max-width:600px; margin:auto; background:#fff; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
#custom-player button {
  background:#0d6efd; color:#fff; border:none; padding:10px 15px; border-radius:5px; cursor:pointer; font-size:1rem; transition:background 0.3s;
}
#custom-player button:hover { background:#095bb5; }
#seekBar { flex:1; min-width:150px; height:5px; cursor:pointer; }
#nowPlaying { margin-top:10px; font-weight:bold; color:#fff; }

#select-song-btn { display:block; margin:20px auto; padding:12px 20px; font-size:1.1rem; background:#0d6efd; color:#fff; border:none; border-radius:8px; cursor:pointer; }
#select-song-btn:hover { background:#095bb5; }

#songModal {
  display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:999;
}
#songModal.show { display:flex; }
#modalContent {
  background:#fff; padding:20px; border-radius:10px; max-width:90%; max-height:80%; overflow-y:auto; width:80%; max-width:400px;
}
#songList { display:flex; flex-direction:column; gap:8px; }
.song { padding:10px; background:#eee; border-radius:5px; cursor:pointer; }
.song:hover { background:#ddd; }
</style>
</head>
<body>

<header>
  <div class="container">
    <h1>AI Evolutions HQ</h1>
    <nav>
      <a onclick="showSection('home')">Home</a>
      <a onclick="showSection('about')">About Us</a>
      <a onclick="showSection('services')">Our Services</a>
      <a onclick="showSection('contact')">Contact Us</a>
    </nav>
  </div>
</header>

<!-- Sections -->
<section id="home" class="active">
  <div class="hero"><h2>Empowering Your Tech Journey</h2></div>
</section>

<section id="about">
  <h2>About Us</h2>
  <div class="about-us">
    <p>(Your about text here...)</p>
  </div>
</section>

<section id="services">
  <h2>Our Services</h2>
</section>

<section id="contact">
  <h2>Contact Us</h2>
</section>

<!-- Music Player -->
<h3 style="text-align:center;">Your Music Player</h3>
<div id="custom-player">
  <button class="play-pause" onclick="togglePlay()">► Play</button>
  <input type="range" id="seekBar" onchange="setSeek()" oninput="updateSeek()" min="0" max="100" value="0"/>
  <button onclick="toggleMute()">🔊 Mute</button>
</div>
<div id="nowPlaying">No song selected</div>
<audio id="customAudio"></audio>

<!-- Button to open song list modal -->
<button id="select-song-btn" onclick="openModal()">Select a Song</button>

<!-- Modal for song list -->
<div id="songModal">
  <div id="modalContent">
    <h3 style="text-align:center;">Choose a Song</h3>
    <div id="songList">
      <div class="song" onclick="playSelected('https://www.w3schools.com/html/horse.mp3', 'Horse')">Horse</div>
      <div class="song" onclick="playSelected('https://www.w3schools.com/html/horse.mp3', 'Horse')">Horse</div>
      <div class="song" onclick="playSelected('https://www.w3schools.com/html/horse.mp3', 'Horse')">Horse</div>
    </div>
    <button style="margin-top:10px; padding:8px; background:#333; color:#fff; border:none; border-radius:5px; cursor:pointer;" onclick="closeModal()">Close</button>
  </div>
</div>

<!-- Scripts -->
<script>
  // Page navigation
  function showSection(id) {
    document.querySelectorAll('section').forEach(sec => sec.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // Modal control
  const modal = document.getElementById('songModal');
  function openModal() { modal.classList.add('show'); }
  function closeModal() { modal.classList.remove('show'); }

  // Play selected song
  function playSelected(src, title) {
    const audio = document.getElementById('customAudio');
    const nowPlaying = document.getElementById('nowPlaying');
    const playBtn = document.querySelector('.play-pause');
    audio.src = src;
    nowPlaying.innerText = 'Now Playing: ' + title;
    audio.play(); // auto-start
    playBtn.innerText = '❚❚ Pause'; // change button to pause
    closeModal();
  }

  // Controls
  const audio = document.getElementById('customAudio');
  const playBtn = document.querySelector('.play-pause');
  const seekBar = document.getElementById('seekBar');
  const nowPlaying = document.getElementById('nowPlaying');

  function togglePlay() {
    if (audio.paused) {
      audio.play();
      playBtn.innerText = '❚❚ Pause';
    } else {
      audio.pause();
      playBtn.innerText = '► Play';
    }
  }

  function updateSeek() {
    if (audio.duration) {
      seekBar.value = (audio.currentTime / audio.duration) * 100;
    }
  }

  function setSeek() {
    if (audio.duration) {
      audio.currentTime = (seekBar.value / 100) * audio.duration;
    }
  }

  function toggleMute() {
    audio.muted = !audio.muted;
  }

  // Update seek bar as audio plays
  audio.addEventListener('timeupdate', () => {
    if (audio.duration) {
      seekBar.value = (audio.currentTime / audio.duration) * 100;
    }
  });

  // set default song if needed
  // document.getElementById('customAudio').src='your-default.mp3';

</script>

</body>
</html>
