<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Single Song Player with Selection</title>
<style>
  body { font-family: Arial, sans-serif; background:#f4f4f4; padding:20px; }
  #playerContainer {
    background-color: red; border: 3px solid black; border-radius:10px; padding: 10px; max-width:600px; margin:auto;
    display:flex; flex-direction:column; align-items:center;
  }
  #controls {
    display:flex; gap:10px; margin-top:10px; align-items:center;
  }
  button { padding:10px; border:none; border-radius:5px; cursor:pointer; }
  #nowPlaying { margin-top:10px; font-weight:bold; color:#fff; }
  #songList {margin-top:20px;}
  .song { padding:10px; background:#fff; margin-bottom:5px; cursor:pointer; border-radius:5px; }
  .song:hover { background:#eee; }
  #modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content:center; align-items:center; }
  #modal.show { display:flex; }
  #modalContent { background:#fff; padding:20px; border-radius:10px; max-width:80%; max-height:80%; overflow:auto; }
</style>
</head>
<body>

<h2 style="text-align:center;">My Single Song Player</h2>
<div id="playerContainer">
  <div id="controls">
    <button id="playBtn" onclick="togglePlay()">► Play</button>
    <input type="range" id="seekBar" onchange="setSeek()" oninput="updateSeek()" min="0" max="100" value="0" style="flex:1;"/>
    <button onclick="toggleMute()">🔊 Mute</button>
  </div>
  <div id="nowPlaying">No song selected</div>
</div>

<div style="text-align:center; margin-top:20px;">
  <button onclick="openModal()">Select a Song</button>
</div>

<!-- Hidden audio element -->
<audio id="audio" src="" style="display:none;"></audio>

<!-- Modal for song selection -->
<div id="modal">
  <div id="modalContent">
    <h3>Select a Song</h3>
    <div id="songList">
      <div class="song" onclick="playSelected('https://www.w3schools.com/html/horse.mp3', 'Horse')">Horse</div>
      <div class="song" onclick="playSelected('https://www.w3schools.com/html/horse.mp3', 'Horse')">Horse</div>
      <div class="song" onclick="playSelected('https://www.w3schools.com/html/horse.mp3', 'Horse')">Horse</div>
    </div>
    <button style="margin-top:10px; padding:8px; border:none; background:#333; color:#fff; border-radius:5px; cursor:pointer;" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const seekBar = document.getElementById('seekBar');
  const nowPlaying = document.getElementById('nowPlaying');

  function openModal() {
    document.getElementById('modal').classList.add('show');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('show');
  }

  function playSelected(src, title) {
    audio.src = src;
    nowPlaying.innerText = 'Now Playing: ' + title;
    audio.play(); // Auto-play
    playBtn.innerText = '❚❚ Pause'; // Update button to pause
    closeModal();
  }

  function togglePlay() {
    if (audio.paused) {
      audio.play();
      playBtn.innerText = '❚❚ Pause';
    } else {
      audio.pause();
      playBtn.innerText = '► Play';
    }
  }

  function updateSeek() {
    if (audio.duration) {
      seekBar.value = (audio.currentTime / audio.duration) * 100;
    }
  }

  function setSeek() {
    if (audio.duration) {
      audio.currentTime = (seekBar.value / 100) * audio.duration;
    }
  }

  function toggleMute() {
    audio.muted = !audio.muted;
  }

  // Update seek bar as audio plays
  audio.addEventListener('timeupdate', () => {
    if (audio.duration) {
      seekBar.value = (audio.currentTime / audio.duration) * 100;
    }
  });

  // Set default song
  window.onload = () => {
    // Optional: set default song
    // playSelected('your-song-path.mp3', 'Default Song');
  };
</script>

</body>
</html>
