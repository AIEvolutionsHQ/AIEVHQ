<body>

<header>
  <div class="container">
    <h1>AI Evolutions HQ</h1>
    <nav>
      <a onclick="showSection('home')">Home</a>
      <a onclick="showSection('about')">About Us</a>
      <a onclick="showSection('services')">Our Services</a>
      <a onclick="showSection('contact')">Contact Us</a>
    </nav>
  </div>
</header>

<!-- Your sections (unchanged) -->
<section id="home" class="active">

<!-- Your existing script block -->
<script>
  // Your existing code ... (any other functions you have) ...

  // Add this function to handle page section switching
  function showSection(id) {
    document.querySelectorAll('section').forEach(sec => sec.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
</script>
</body>
